# Model architecture hyperparameters for HybridCNNViT and SpectralViT
model:
  name: "HybridCNNViT"
  in_channels: 1
  pca_components: 32
  patch_size: 11
  num_classes: 3
  forecast_horizons: [7, 14, 21]

cnn_stem:
  init_channels: 16
  res_channels: [32, 64]
  se_reduction: 8
  dropout: 0.1
  use_se: true
  stem_kernel: [3, 3, 3]

adapter:
  in_channels: 64
  spectral_dim: 16
  group_size: 4
  spatial_pooling: "avg"
  d_model: 128

vit_backbone:
  d_model: 128
  token_group_size: 4
  n_layers: 4
  n_heads: 4
  mlp_ratio: 4.0
  dropout: 0.1
  attention_dropout: 0.1
  stochastic_depth: 0.1
  pooling: "cls"
  pos_embedding_type: "learned"

heads:
  state_head:
    num_classes: 3
  severity_head:
    output_dim: 1
  forecast_head:
    output_dim: 1
    horizons: 3
