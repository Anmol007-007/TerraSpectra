name: Python Tests

on:
  push:
    branches: [main, "day/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e ".[dev,geo]"
      - name: Run tests
        run: pytest tests --cov=src/terraspectra --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

